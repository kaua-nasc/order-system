services:
  otel-collector:
    container_name: otel-collector
    image: otel/opentelemetry-collector-contrib
    volumes:
      - ./otel-collector-config.yaml:/etc/otelcol-contrib/config.yaml
    ports:
      - "${PORT_OTEL_GRPC}:4317"
      - "${PORT_OTEL_HTTP}:4318"
      - "8889:8889"

  jaeger:
    image: jaegertracing/jaeger:latest
    container_name: jaeger
    ports:
      - "4319:4319"
      - "4320:4320"
      - "16686:16686"
    volumes:
      - ./jaeger-config.yaml:/etc/jaeger/config.yaml
      - ./data/jaeger:/badger/data
    command: ["--config=/etc/jaeger/config.yaml"]

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - ./data/prometheus:/prometheus
    ports:
      - "${PORT_PROMETHEUS}:9090"
    user: root

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "${PORT_GRAFANA}:3000"
    volumes:
      - ./data/grafana:/var/lib/grafana
    user: root

  loki:
    image: grafana/loki:latest
    container_name: loki
    ports:
      - "${PORT_LOKI}:3100"
    command: -config.file=/etc/loki/loki-config.yaml
    volumes:
      - ./loki-config.yaml:/etc/loki/loki-config.yaml
      - ./data/loki:/loki
    user: root

  rabbitmq:
    image: rabbitmq:management
    container_name: rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS}
      RABBITMQ_DEFINITIONS_FILE: /etc/rabbitmq/rabbitmq_definitions.json
    volumes:
      - ./data/rabbitmq:/var/lib/rabbitmq

  postgre:
    image: postgres:18-alpine
    container_name: postgre
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "5432:5432"
    volumes:
      - ./data/postgres:/var/lib/postgresql/data

  vault:
    image: hashicorp/vault:latest
    container_name: vault
    ports:
      - "8200:8200"
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: meu-token-super-secreto
      VAULT_ADDR: "http://0.0.0.0:8200"
    cap_add:
      - IPC_LOCK
    volumes:
      - ./data/vault:/vault/file

  consul:
    image: hashicorp/consul:latest
    container_name: consul
    ports:
      - "8500:8500"
    command: agent -server -bind=0.0.0.0 -client=0.0.0.0 -bootstrap-expect=1 -ui
    volumes:
      - ./data/consul:/consul/data
